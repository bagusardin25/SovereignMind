name: CI

on:
  push:
    branches: [main, smartcontract, frontend]
  pull_request:
    branches: [main]

jobs:
  contracts:
    name: Contracts (Hardhat)
    runs-on: ubuntu-latest
    default-timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: contracts/package-lock.json

      - name: Install dependencies
        working-directory: contracts
        run: npm ci --no-audit --no-fund

      - name: Compile
        working-directory: contracts
        run: npx hardhat compile

      - name: Sync ABIs
        working-directory: contracts
        run: npx hardhat run scripts/copy-abis.ts

      - name: Run tests
        working-directory: contracts
        run: npx hardhat test

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    default-timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Type-check
        working-directory: frontend
        run: npx tsc --noEmit
        continue-on-error: false

      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          NEXT_PUBLIC_SOMNIA_RPC_URL: https://dream-rpc.somnia.network
          NEXT_PUBLIC_ORCHESTRATOR_URL: http://localhost:3001

  orchestrator:
    name: Orchestrator (Node.js)
    runs-on: ubuntu-latest
    default-timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: orchestrator/package-lock.json

      - name: Install dependencies
        working-directory: orchestrator
        run: npm ci --no-audit --no-fund

      - name: Type-check
        working-directory: orchestrator
        run: npx tsc --noEmit
